<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.settings.name }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}">Главная</a>
    <a href="{{ '/works/' | relative_url }}">Работы</a>
    <a href="{{ '/#contacts' | relative_url }}">Контакты</a>
  </nav>
</header>

<main>{{ content }}</main>

<footer>
  <div>{{ site.data.settings.name }}</div>
  <div>Авторские работы и ручное творчество</div>
</footer>
</body>
</html>
